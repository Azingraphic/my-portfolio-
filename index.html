<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Azin | Video Editor & Thumbnail Designer</title>
    <style>
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: #121212;
            color: #ffffff;
            text-align: center;
            padding: 50px 20px;
            margin: 0;
        }
        .container {
            max-width: 800px;
            margin: 0 auto;
        }
        h1 {
            font-size: 3rem;
            letter-spacing: 2px;
            margin-bottom: 10px;
            color: #f5a623;
        }
        h2 {
            font-size: 1.2rem;
            font-weight: 400;
            color: #aaaaaa;
            margin-bottom: 40px;
        }
        .bio {
            font-size: 1.1rem;
            line-height: 1.6;
            margin-bottom: 40px;
            color: #dddddd;
        }
        .links {
            display: flex;
            justify-content: center;
            gap: 15px;
            flex-wrap: wrap;
        }
        .btn {
            display: inline-block;
            padding: 12px 24px;
            background-color: #f5a623;
            color: #121212;
            text-decoration: none;
            font-weight: bold;
            border-radius: 5px;
            transition: 0.3s;
        }
        .btn:hover {
            background-color: #ffffff;
        }
        .btn-outline {
            background-color: transparent;
            color: #f5a623;
            border: 2px solid #f5a623;
        }
        .btn-outline:hover {
            background-color: #f5a623;
            color: #121212;
        }
    </style>
</head>
